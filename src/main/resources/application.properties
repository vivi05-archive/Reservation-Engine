spring.application.name=inventory-engine

# In-memory H2 database (data resets on every restart)
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Artificial delay inside the check-then-act gap (ms). Makes the race easy to see. Set 0 to disable.
inventory.processing-delay-ms=5
